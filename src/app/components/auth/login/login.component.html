<div class="login-root">
  <div class="scene">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Floating particles -->
    <div *ngFor="let p of particles" class="particle" [ngStyle]="{
      left: p.left + 'vw',
      width: p.width + 'px',
      height: p.height + 'px',
      animationDuration: p.duration + 's',
      animationDelay: p.delay + 's'
    }">
    </div>
  </div>

  <div class="auth-page">
    <div class="auth-card">

      <!-- Brand -->
      <div class="auth-brand">
        <div class="brand-icon">
          <i class="bi bi-trophy-fill"></i>
        </div>
        <div class="brand-text">
          <span class="brand-title">Achievement</span>
          <span class="brand-sub">Tracker</span>
        </div>
      </div>

      <!-- Heading -->
      <div class="auth-heading">
        <h1 class="auth-title">Iniciar sesión</h1>
        <p class="auth-desc">Accede a tu biblioteca de juegos</p>
      </div>

      <!-- Error -->
      @if (errorMessage) {
      <div class="auth-error">
        <i class="bi bi-exclamation-triangle-fill"></i>
        {{ errorMessage }}
      </div>
      }

      <!-- Form -->
      <form (ngSubmit)="login()" class="auth-form">

        <div class="field-group">
          <label class="field-label" for="email">
            <i class="bi bi-envelope"></i>
            Email
          </label>
          <input type="email" id="email" name="email" class="field-input"
            [class.field-error]="emailRef.invalid && emailRef.touched"
            [class.field-valid]="emailRef.valid && emailRef.touched" placeholder="usuario@email.com"
            [(ngModel)]="formLogin.email" autocomplete="email" #emailRef="ngModel" required email />
          <span class="field-hint error" *ngIf="emailRef.errors?.['required'] && emailRef.touched">
            El email es obligatorio
          </span>
          <span class="field-hint error" *ngIf="emailRef.errors?.['email'] && emailRef.touched">
            El formato del email no es válido
          </span>
        </div>

        <div class="field-group">
          <label class="field-label" for="password">
            <i class="bi bi-lock"></i>
            Contraseña
          </label>
          <input type="password" id="password" name="password" class="field-input"
            [class.field-error]="passwdRef.invalid && passwdRef.touched"
            [class.field-valid]="passwdRef.valid && passwdRef.touched" placeholder="••••••••"
            [(ngModel)]="formLogin.passwd" autocomplete="current-password" #passwdRef="ngModel" required
            minlength="5" />
          <span class="field-hint error" *ngIf="passwdRef.errors?.['required'] && passwdRef.touched">
            La contraseña es obligatoria
          </span>
          <span class="field-hint error" *ngIf="passwdRef.errors?.['minlength'] && passwdRef.touched">
            La contraseña debe tener al menos 5 caracteres
          </span>
        </div>

        <button type="submit" class="btn-primary-auth" [disabled]="emailRef.invalid || passwdRef.invalid">
          <i class="bi bi-box-arrow-in-right"></i>
          Iniciar sesión
        </button>

        <div class="auth-divider">
          <span></span>
          <p>o continúa con</p>
          <span></span>
        </div>

        <button type="button" class="btn-google" (click)="loginGoogle()">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"
              fill="#4285F4" />
            <path
              d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"
              fill="#34A853" />
            <path
              d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"
              fill="#FBBC05" />
            <path
              d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"
              fill="#EA4335" />
          </svg>
          Continuar con Google
        </button>

      </form>

      <!-- Footer -->
      <p class="auth-footer">
        ¿No tienes cuenta?
        <a routerLink="/signin" class="auth-link">Crear cuenta</a>
      </p>

    </div>
  </div>
</div>
