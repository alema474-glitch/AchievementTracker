<div class="completeprofile-root">

  <!-- Background scene -->
  <div class="scene">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div *ngFor="let p of particles" class="particle" [ngStyle]="{
      left: p.left + 'vw',
      width: p.width + 'px',
      height: p.height + 'px',
      animationDuration: p.duration + 's',
      animationDelay: p.delay + 's'
    }"></div>
  </div>

  <div class="auth-page">
    <div class="auth-card">

      <!-- Brand -->
      <div class="auth-brand">
        <div class="brand-icon">
          <i class="bi bi-trophy-fill"></i>
        </div>
        <div class="brand-text">
          <span class="brand-title">Achievement</span>
          <span class="brand-sub">Tracker</span>
        </div>
      </div>

      <!-- Heading -->
      <div class="auth-heading">
        <h1 class="auth-title">Completa tu perfil</h1>
        <p class="auth-desc">Solo un paso más para empezar</p>
      </div>

      <!-- Info notice -->
      <div class="auth-notice">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"
            fill="#4285F4" />
          <path
            d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"
            fill="#34A853" />
          <path
            d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"
            fill="#FBBC05" />
          <path
            d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"
            fill="#EA4335" />
        </svg>
        Has iniciado sesión con Google. Completa tu perfil para continuar.
      </div>

      <!-- Form -->
      <form (ngSubmit)="saveProfile()" #profileForm="ngForm" class="auth-form">

        <!-- Username -->
        <div class="field-group">
          <label class="field-label" for="username">
            <i class="bi bi-at"></i>
            Nombre de usuario
          </label>
          <input type="text" id="username" name="username" class="field-input"
            [class.field-valid]="usernameRef.valid && usernameRef.touched"
            [class.field-error]="usernameRef.invalid && usernameRef.touched" placeholder="username"
            [(ngModel)]="username" #usernameRef="ngModel" required minlength="3" />
          <span class="field-hint error" *ngIf="usernameRef.errors?.['required'] && usernameRef.touched">
            El nombre de usuario es obligatorio
          </span>
          <span class="field-hint error" *ngIf="usernameRef.errors?.['minlength'] && usernameRef.touched">
            Mínimo 3 caracteres
          </span>
        </div>

        <!-- Nombre + Apellidos -->
        <div class="field-row">
          <div class="field-group">
            <label class="field-label" for="firstName">
              <i class="bi bi-person"></i>
              Nombre
            </label>
            <input type="text" id="firstName" name="firstName" class="field-input"
              [class.field-valid]="firstNameRef.valid && firstNameRef.touched"
              [class.field-error]="firstNameRef.invalid && firstNameRef.touched" placeholder="Tu nombre"
              [(ngModel)]="firstName" #firstNameRef="ngModel" required />
            <span class="field-hint error" *ngIf="firstNameRef.errors?.['required'] && firstNameRef.touched">
              El nombre es obligatorio
            </span>
          </div>

          <div class="field-group">
            <label class="field-label" for="lastName">
              <i class="bi bi-person"></i>
              Apellidos
            </label>
            <input type="text" id="lastName" name="lastName" class="field-input"
              [class.field-valid]="lastNameRef.valid && lastNameRef.touched"
              [class.field-error]="lastNameRef.invalid && lastNameRef.touched" placeholder="Tus apellidos"
              [(ngModel)]="lastName" #lastNameRef="ngModel" required />
            <span class="field-hint error" *ngIf="lastNameRef.errors?.['required'] && lastNameRef.touched">
              Los apellidos son obligatorios
            </span>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary-auth" [disabled]="profileForm.invalid">
          <i class="bi bi-check-lg"></i>
          Guardar y continuar
        </button>

      </form>

    </div>
  </div>

</div>
